<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Mermaid Diver</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04304a; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="sea"></canvas>
<script>
const cv = document.getElementById('sea');
const ctx = cv.getContext('2d');
let W, H, floorY;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  floorY = H * 0.88;
}
addEventListener('resize', resize);
resize();

// ---- where she swims to ----
const target = { x: W / 2, y: H / 2 };
const mer = { x: W / 2, y: H / 2, vx: 0, vy: 0, face: 1 };
function aim(e) { target.x = e.clientX; target.y = e.clientY; }
cv.addEventListener('pointermove', aim);
cv.addEventListener('pointerdown', aim);

const rnd = (a, b) => a + Math.random() * (b - a);

// ---- scenery ----
const weeds = Array.from({ length: 14 }, (_, i) => ({
  x: (i + 0.5) / 14 * 1 + rnd(-0.03, 0.03), h: rnd(60, 160), ph: rnd(0, 6), hue: rnd(120, 160)
}));
const corals = Array.from({ length: 6 }, () => ({
  x: rnd(0.05, 0.95), s: rnd(0.7, 1.3), c: ['#ff6f91', '#ff9671', '#c34a9b', '#f9a8d4'][Math.floor(rnd(0, 4))]
}));
const stars = Array.from({ length: 3 }, () => ({ x: rnd(0.1, 0.9), r: rnd(9, 15) }));
const fish = Array.from({ length: 9 }, () => ({
  x: rnd(0, W), y: rnd(H * 0.15, H * 0.7), v: rnd(30, 70) * (Math.random() < 0.5 ? -1 : 1),
  hue: rnd(10, 60), s: rnd(0.8, 1.4), ph: rnd(0, 6)
}));
const jellies = Array.from({ length: 3 }, () => ({ x: rnd(0, W), y: rnd(H * 0.2, H * 0.6), ph: rnd(0, 6) }));
const bubbles = Array.from({ length: 25 }, () => ({ x: rnd(0, W), y: rnd(0, H), r: rnd(1.5, 5), v: rnd(10, 30) }));
const hearts = [];

function heartPath(s) {
  ctx.beginPath();
  ctx.moveTo(0, s * 0.35);
  ctx.bezierCurveTo(-s, -s * 0.3, -s * 0.5, -s * 1.0, 0, -s * 0.45);
  ctx.bezierCurveTo(s * 0.5, -s * 1.0, s, -s * 0.3, 0, s * 0.35);
  ctx.closePath();
}

function drawBackground(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2fa4c7'); g.addColorStop(0.6, '#0b5d86'); g.addColorStop(1, '#04304a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // light rays
  ctx.save();
  for (let i = 0; i < 5; i++) {
    const x = (i + 0.5) / 5 * W + Math.sin(t * 0.3 + i) * 40;
    const rg = ctx.createLinearGradient(0, 0, 0, H * 0.8);
    rg.addColorStop(0, 'rgba(255,255,255,0.18)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.moveTo(x - 20, 0); ctx.lineTo(x + 20, 0);
    ctx.lineTo(x + 110, H * 0.8); ctx.lineTo(x - 70, H * 0.8); ctx.fill();
  }
  ctx.restore();
}

function drawFloor(t) {
  // sand
  ctx.fillStyle = '#e8cf9a';
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, floorY + Math.sin(x * 0.01) * 8);
  ctx.lineTo(W, H); ctx.fill();
  // coral
  for (const c of corals) {
    ctx.save(); ctx.translate(c.x * W, floorY + 6); ctx.scale(c.s, c.s);
    ctx.strokeStyle = c.c; ctx.lineWidth = 7; ctx.lineCap = 'round';
    for (const a of [-0.7, -0.25, 0.25, 0.7]) {
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(Math.sin(a) * 20, -25, Math.sin(a) * 45, -55 - Math.cos(a) * 10); ctx.stroke();
    }
    ctx.restore();
  }
  // starfish
  for (const s of stars) {
    ctx.save(); ctx.translate(s.x * W, floorY + 22); ctx.fillStyle = '#ff9a5c'; ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? s.r * 0.45 : s.r, a = i * Math.PI / 5 - Math.PI / 2;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.fill(); ctx.restore();
  }
  // seaweed
  ctx.lineCap = 'round';
  for (const w of weeds) {
    ctx.strokeStyle = `hsl(${w.hue},55%,32%)`; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(w.x * W, floorY + 10);
    for (let i = 1; i <= 6; i++) {
      const k = i / 6;
      ctx.lineTo(w.x * W + Math.sin(t * 1.2 + w.ph + k * 3) * 14 * k, floorY + 10 - w.h * k);
    }
    ctx.stroke();
  }
}

function drawFish(f) {
  ctx.save(); ctx.translate(f.x, f.y); ctx.scale(Math.sign(f.v) * f.s, f.s);
  ctx.fillStyle = `hsl(${f.hue},90%,60%)`;
  ctx.beginPath(); ctx.ellipse(0, 0, 14, 7, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-23, -7 + Math.sin(f.ph) * 3); ctx.lineTo(-23, 7 + Math.sin(f.ph) * 3); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(7, -2, 2, 0, 7); ctx.fill();
  ctx.fillStyle = '#123'; ctx.beginPath(); ctx.arc(7.5, -2, 1, 0, 7); ctx.fill();
  ctx.restore();
}

function drawJelly(j, t) {
  const y = j.y + Math.sin(t * 0.8 + j.ph) * 25, p = 1 + Math.sin(t * 2 + j.ph) * 0.08;
  ctx.save(); ctx.translate(j.x, y); ctx.scale(1, p);
  ctx.fillStyle = 'rgba(255,190,240,0.55)';
  ctx.beginPath(); ctx.arc(0, 0, 20, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = 'rgba(255,190,240,0.55)'; ctx.lineWidth = 2;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.moveTo(i * 8, 0);
    ctx.quadraticCurveTo(i * 8 + Math.sin(t * 2 + i) * 6, 18, i * 8, 34); ctx.stroke();
  }
  ctx.restore();
}

function sparkle(x, y, r, a) {
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = a; ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(0, -r); ctx.quadraticCurveTo(0, 0, r, 0); ctx.quadraticCurveTo(0, 0, 0, r);
  ctx.quadraticCurveTo(0, 0, -r, 0); ctx.quadraticCurveTo(0, 0, 0, -r); ctx.fill();
  ctx.restore();
}

// ---- the mermaid (drawn facing right, tail trailing to the left) ----
function drawMermaid(t, speed) {
  const swish = 0.4 + Math.min(speed / 200, 1) * 0.8;

  // hair, behind everything
  for (let i = 0; i < 9; i++) {
    const pink = i % 3 === 1;
    ctx.strokeStyle = pink ? '#ff7eb6' : (i % 2 ? '#f6c945' : '#e8a92b');
    ctx.lineWidth = 5; ctx.lineCap = 'round';
    const y0 = -26 + i * 2.5;
    ctx.beginPath(); ctx.moveTo(14, y0);
    const w1 = Math.sin(t * 4 + i * 0.7) * 8 * swish, w2 = Math.sin(t * 4 + i * 0.7 + 1.5) * 12 * swish;
    ctx.bezierCurveTo(-10, y0 - 8 + w1, -35, y0 + 8 + w2, -62 - i * 2, y0 + 14 + i * 3 + w1);
    ctx.stroke();
  }

  // tail
  const N = 14, pts = [];
  for (let i = 0; i <= N; i++) {
    const k = i / N;
    pts.push({ x: -8 - k * 105, y: 8 + Math.sin(t * 5 - k * 4) * 16 * k * swish, w: 15 * (1 - k) + 3 });
  }
  for (let i = 0; i < N; i++) {
    const a = pts[i], b = pts[i + 1];
    const sh = 0.5 + 0.5 * Math.sin(t * 3 - i * 0.7);          // shimmer wave: emerald <-> silver
    ctx.fillStyle = `hsl(${150 - sh * 20},${70 - sh * 55}%,${34 + sh * 40}%)`;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y - a.w); ctx.lineTo(b.x - 1, b.y - b.w);
    ctx.lineTo(b.x - 1, b.y + b.w); ctx.lineTo(a.x, a.y + a.w); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.2;     // scales
    ctx.beginPath(); ctx.arc(a.x, a.y, a.w * 0.8, Math.PI * 0.55, Math.PI * 1.45); ctx.stroke();
  }
  const e = pts[N];                                            // fin
  const fg = ctx.createLinearGradient(e.x, 0, e.x - 40, 0);
  fg.addColorStop(0, '#12a374'); fg.addColorStop(1, '#e6eef2');
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.moveTo(e.x + 3, e.y);
  ctx.quadraticCurveTo(e.x - 20, e.y - 38, e.x - 44, e.y - 34 + Math.sin(t * 5) * 6);
  ctx.quadraticCurveTo(e.x - 28, e.y, e.x - 44, e.y + 34 + Math.sin(t * 5) * 6);
  ctx.quadraticCurveTo(e.x - 20, e.y + 38, e.x + 3, e.y); ctx.fill();

  // torso + sparkly top
  ctx.fillStyle = '#ffd9bf';
  ctx.beginPath(); ctx.ellipse(6, 2, 19, 13, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff8cc6';
  ctx.beginPath(); ctx.ellipse(12, 0, 8, 11, 0, 0, 7); ctx.fill();
  sparkle(12, -3, 4, 0.6 + 0.4 * Math.sin(t * 6));

  // arm
  ctx.strokeStyle = '#ffd9bf'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(8, 4); ctx.lineTo(-4 + Math.sin(t * 5) * 4, 16); ctx.stroke();

  // head
  ctx.fillStyle = '#ffd9bf';
  ctx.beginPath(); ctx.arc(26, -12, 12, 0, 7); ctx.fill();
  ctx.fillStyle = '#f6c945';                                   // fringe
  ctx.beginPath(); ctx.arc(24, -16, 12, Math.PI * 1.05, Math.PI * 1.9); ctx.fill();
  ctx.fillStyle = '#e0607e';                                   // smile
  ctx.beginPath(); ctx.arc(33, -6, 3, 0.1, Math.PI - 0.1); ctx.fill();

  // bling goggles + mask
  ctx.strokeStyle = '#ff5fa8'; ctx.lineWidth = 3;              // strap
  ctx.beginPath(); ctx.moveTo(16, -15); ctx.lineTo(14, -18); ctx.stroke();
  const gg = ctx.createLinearGradient(26, -26, 40, -12);
  gg.addColorStop(0, 'rgba(180,240,255,0.9)'); gg.addColorStop(1, 'rgba(255,200,240,0.8)');
  ctx.fillStyle = gg; ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(32, -14, 8, 7, 0, 0, 7); ctx.fill(); ctx.stroke();
  for (let i = 0; i < 8; i++) {                                // rhinestones on the rim
    const a = i * Math.PI / 4 + t;
    ctx.fillStyle = i % 2 ? '#ff7eb6' : '#fff';
    ctx.beginPath(); ctx.arc(32 + Math.cos(a) * 9.5, -14 + Math.sin(a) * 8.5, 1.5, 0, 7); ctx.fill();
  }
  sparkle(30, -17, 4, 0.5 + 0.5 * Math.sin(t * 7));
  sparkle(48 + Math.sin(t * 3) * 2, -24, 5, 0.5 + 0.5 * Math.sin(t * 5 + 2));
}

// ---- main loop ----
let last = performance.now(), hearTimer = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05), t = now / 1000;
  last = now;

  // swim toward target: faster when far, gentle when near
  const dx = target.x - mer.x, dy = target.y - mer.y, dist = Math.hypot(dx, dy);
  const want = Math.min(dist * 1.6, 320);
  const tx = dist > 1 ? dx / dist * want : 0, ty = dist > 1 ? dy / dist * want : 0;
  mer.vx += (tx - mer.vx) * Math.min(dt * 3, 1);
  mer.vy += (ty - mer.vy) * Math.min(dt * 3, 1);
  mer.x += mer.vx * dt; mer.y += mer.vy * dt;
  mer.y = Math.min(mer.y, floorY - 10);
  if (Math.abs(mer.vx) > 8) mer.face += ((mer.vx > 0 ? 1 : -1) - mer.face) * Math.min(dt * 8, 1);
  const speed = Math.hypot(mer.vx, mer.vy);

  // heart bubbles from her head
  hearTimer -= dt;
  if (hearTimer <= 0) {
    hearTimer = rnd(0.12, 0.3) - Math.min(speed / 2000, 0.08);
    hearts.push({
      x: mer.x + mer.face * 30 + rnd(-8, 8), y: mer.y - 18, s: rnd(6, 14),
      v: rnd(35, 70), ph: rnd(0, 6), life: 0
    });
  }
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i]; h.life += dt; h.y -= h.v * dt; h.x += Math.sin(h.life * 3 + h.ph) * 18 * dt;
    if (h.y < -30 || h.life > 9) hearts.splice(i, 1);
  }

  // scenery movement
  for (const f of fish) { f.x += f.v * dt; f.ph += dt * 8; if (f.x > W + 40) f.x = -40; if (f.x < -40) f.x = W + 40; }
  for (const b of bubbles) { b.y -= b.v * dt; if (b.y < -10) { b.y = H + 10; b.x = rnd(0, W); } }

  // draw
  drawBackground(t);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  for (const b of bubbles) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); }
  jellies.forEach(j => drawJelly(j, t));
  fish.forEach(drawFish);
  drawFloor(t);

  ctx.save();
  ctx.translate(mer.x, mer.y);
  ctx.scale(mer.face, 1);
  ctx.rotate(Math.max(-0.5, Math.min(0.5, Math.atan2(mer.vy, Math.max(Math.abs(mer.vx), 40)) * (mer.vx < 0 ? -1 : 1))) * 0.7);
  drawMermaid(t, speed);
  ctx.restore();

  for (const h of hearts) {
    ctx.save(); ctx.translate(h.x, h.y);
    ctx.globalAlpha = Math.max(0, Math.min(1, (9 - h.life) / 3, h.y / 80 + 0.2)) * 0.85;
    heartPath(h.s); ctx.fillStyle = '#ff5fa8'; ctx.fill();
    ctx.strokeStyle = '#ffd0e6'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath();
    ctx.ellipse(-h.s * 0.4, -h.s * 0.5, h.s * 0.14, h.s * 0.08, -0.6, 0, 7); ctx.fill();
    ctx.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
